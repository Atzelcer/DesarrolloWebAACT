<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribunal Agroambiental</title>
    <link rel="stylesheet" href="estilos1.css">
</head>
<body>

    <div class="contenedor-central">
        <header>
            <div class="nav-container">
                <nav>
                    <ul>
                        <li class="dropdown">
                            <button class="nav-btn">Publicaciones ▼</button>
                            <div class="dropdown-content">
                                <p>Noticias</p>
                                <p>Documentos</p>
                                <p>Revistas</p>
                                <p>Boletines</p>
                                <p>Libros</p>
                            </div>
                        </li>
                        <li><button class="nav-btn">Biblioteca</button></li>
                        <li><button class="nav-btn">Eventos Académicos</button></li>
                        <li><button class="nav-btn">Geoinformación</button></li>
                        <li class="dropdown">
                            <button class="nav-btn">Sorteo de Causas ▼</button>
                            <div class="dropdown-content">
                                <p>Casos pendientes</p>
                                <p>Casos resueltos</p>
                                <p>Sorteo de Causas</p>
                            </div>
                        </li>
                        <li><button class="nav-btn">Contáctenos</button></li>
                        <li class="icons">
                            <img src="../imagenes/facebook.png" alt="Facebook">
                            <img src="../imagenes/gorjeo.png" alt="Twitter">
                            <img src="../imagenes/instagram.png" alt="Instagram">
                            <img src="../imagenes/tiktok.png" alt="TikTok">
                            <img src="../imagenes/youtube.png" alt="YouTube">
                        </li>
                    </ul>
                </nav>
            </div>
        </header>


        <section class="banner">
            <img src="../imagenes/policia1.png" alt="Banner Tribunal">
        </section>


        <div class="sub-menu">
            <nav>
                <ul>
                    <li class="dropdown">
                        <button class="sub-btn">Inicio ▼</button>
                        <div class="dropdown-content">
                            <p>Sobre nosotros</p>
                        </div>
                    </li>
                    <li><button class="sub-btn">Institucional</button></li>
                    <li class="dropdown">
                        <button class="sub-btn">Buscadores ▼</button>
                        <div class="dropdown-content">
                            <p>Normativa</p>
                            <p>Resoluciones</p>
                            <p>Acuerdos</p>
                            <p>Reglamentos</p>
                            <p>Convenios</p>
                        </div>
                    </li>
                    <li><button class="sub-btn">Árbol de Jurisprudencia</button></li>
                    <li><button class="sub-btn">Juzgados</button></li>
                    <li><button class="sub-btn">Transparencia</button></li>
                    <li><button class="sub-btn">Noticias</button></li>

        
                    <li class="search-box">
                        <input type="text" placeholder="Escribe y presiona">
                        <button class="search-btn">
                            <img src="../imagenes/lupa.png" alt="Buscar">
                        </button>
                    </li>
                </ul>
            </nav>
        </div>

        <section class="banner">
            <img src="../imagenes/policia2.png" alt="Imagen secundaria">
        </section>

    </div>

</body>
</html>
