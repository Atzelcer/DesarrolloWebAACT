<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Biblioteca</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #0044cc, #007bff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .login-container {
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 320px;
    }
    
    .login-container img.avatar {
      width: 80px;
      margin-bottom: 20px;
    }
    
    .login-container h2 {
      margin-bottom: 25px;
      font-size: 18px;
      color: #333;
    }
    
    .login-container input[type="text"],
    .login-container input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 14px;
    }
    
    .login-container button {
      width: 100%;
      padding: 12px;
      background-color: #0044cc;
      color: white;
      border: none;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    
    .login-container button:hover {
      background-color: #002f99;
    }
    
  </style>
</head>
<body>
  <div class="login-container">
    <form action="autenticar.php" method="POST">
      <img src="imagenes2/Avatar.png" class="avatar" alt="Avatar de usuario">
      <h2>Inicia sesion con tu cuenta</h2>
      <input type="text" name="usuario" placeholder="Usuario" required>
      <input type="password" name="contrasena" placeholder="Contrasena" required>
      <button type="submit">LOG IN</button>
    </form>
  </div>
</body>
</html>
