<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Libro</title>
  <style>
    form {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    form h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    form input, form select, form button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    form button {
      background-color: #006080;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    form button:hover {
      background-color: #004f63;
    }
  </style>
</head>
<body>

  <form id="formLibro" enctype="multipart/form-data">
    <h2>Registrar nuevo libro</h2>

    <input type="text" name="titulo" placeholder="Título del libro" required>
    <input type="text" name="autor" placeholder="Autor" required>
    <input type="number" name="anio" placeholder="Año de publicación" required>

    <select name="ideditorial" required>
      <option value="">Seleccione Editorial</option>
      <option value="1">Alfaomega</option>
      <option value="2">Marcombo</option>
    </select>

    <select name="idusuario" required>
      <option value="">Seleccione Usuario</option>
      <option value="0">Administrador</option>
    </select>

    <select name="idcarrera" required>
      <option value="">Seleccione Carrera</option>
      <option value="1">Informática</option>
      <option value="2">Sistemas</option>
      <option value="3">Software</option>
    </select>

    <input type="file" name="imagen" accept="image/*" required>

    <button type="submit">Registrar</button>
  </form>

</body>
</html>
