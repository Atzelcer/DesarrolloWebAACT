<body>
    <script>
        class Coche{
            constructor(marca, modelo, año) {
                this.marca = marca;
                this.modelo = modelo;
                this.año = año;
            }

            detalles() {
                return `Marca: ${this.marca}, Modelo: ${this.modelo}, Año: ${this.año}`;
            }
        }
    </script>
</body>
