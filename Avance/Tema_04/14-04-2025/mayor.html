<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a = prompt("Inserte el primer numero");
        b = prompt("Inserte el segundo numero");
        c = prompt("Inserte el tercer numero");

        if( a > b && a > c) {
            alert("El mayor es: " + a);
        }

        if( b > a && b > c) {
            alert("El mayor es: " + b);
        }

        if( c > a && c > b) {
            alert("El mayor es: " + c);
        }
    </script>
</body>
</html>
