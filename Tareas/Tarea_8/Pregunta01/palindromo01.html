<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palíndromo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Verificador de Palíndromos</h1>
    <p id="resultado"></p>
</div>

<script type="text/javascript">
    var texto = prompt("Introduce una palabra o frase para verificar si es un palíndromo:");
    texto = texto.toLowerCase().replace(/[\W_]/g, "");

    function esPalindromo(cadena) {
        var invertida = cadena.split('').reverse().join('');
        return cadena === invertida;
    }

    var mensaje = "";
    if (esPalindromo(texto)) {
        mensaje = "Es un palíndromo";
    } else {
        mensaje = "No es un palíndromo";
    }

    document.getElementById("resultado").innerText = mensaje;
</script>

</body>
</html>
