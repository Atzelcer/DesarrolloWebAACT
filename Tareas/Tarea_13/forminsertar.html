<div class="modal-header bg-gradient text-white" style="background: linear-gradient(to right, #6f42c1, #d63384);">
  <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>Nueva Persona</h5>
  <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<div class="modal-body bg-dark text-white">
  <form id="form-insertar" class="needs-validation" novalidate onsubmit="event.preventDefault(); crear();">
    
    <div class="mb-3">
      <label for="nombres" class="form-label">Nombres</label>
      <input type="text" class="form-control bg-dark text-white border-light" id="nombres" name="nombres" required>
      <div class="invalid-feedback">Por favor ingrese los nombres.</div>
    </div>

    <div class="mb-3">
      <label for="apellidos" class="form-label">Apellidos</label>
      <input type="text" class="form-control bg-dark text-white border-light" id="apellidos" name="apellidos" required>
      <div class="invalid-feedback">Por favor ingrese los apellidos.</div>
    </div>

    <div class="mb-3">
      <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
      <input type="date" class="form-control bg-dark text-white border-light" id="fecha_nacimiento" name="fecha_nacimiento" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Sexo</label>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="sexo" id="masculino" value="Masculino" required>
        <label class="form-check-label" for="masculino">Masculino</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="sexo" id="femenino" value="Femenino">
        <label class="form-check-label" for="femenino">Femenino</label>
      </div>
    </div>

    <div class="mb-3">
      <label for="correo" class="form-label">Correo Electrónico</label>
      <input type="email" class="form-control bg-dark text-white border-light" id="correo" name="correo" required>
      <div class="invalid-feedback">Por favor ingrese un correo válido.</div>
    </div>

    <div class="modal-footer bg-dark border-top border-secondary">
      <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
      <button type="submit" class="btn btn-pink text-white" style="background-color: #d63384;">Guardar</button>
    </div>

  </form>
</div>
