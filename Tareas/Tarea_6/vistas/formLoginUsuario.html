<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Usuario</title>
  <link rel="stylesheet" href="../publicos/css/style-login.css">
</head>
<body>
  <div class="formulario">
    <h2>Iniciar Sesión como Usuario</h2>
    <form action="../seguridad/autentificarUsuario.php" method="post">
      <label for="usuario">Correo o Nombre:</label>
      <input type="text" name="usuario" required>

      <label for="contrasenia">Contraseña:</label>
      <input type="password" name="contrasenia" required>

      <div class="botones-finales">
        <button type="submit">Ingresar</button>
        <button type="button" onclick="location.href='../Pagina-principal-index.html'">Volver</button>
      </div>
    </form>
  </div>
</body>
</html>
