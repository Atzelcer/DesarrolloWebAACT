<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario</title>
    <link rel="stylesheet" href="../publicos/css/login-pagina_index.css">
</head>
<body>
    <h2>Registrar Nuevo Usuario</h2>

    <form action="../controladores/createUsuario.php" method="post">
      <label for="nombres">Nombres:</label>
      <input type="text" name="nombres" required><br><br>
  
      <label for="apellidos">Apellidos:</label>
      <input type="text" name="apellidos" required><br><br>
  
      <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
      <input type="date" name="fecha_nacimiento" required><br><br>
  
      <label for="sexo">Sexo:</label>
      <input type="radio" name="sexo" value="Masculino" required> Masculino
      <input type="radio" name="sexo" value="Femenino"> Femenino<br><br>
  
      <label for="correo">Correo:</label>
      <input type="email" name="correo" required><br><br>
  
      <label for="profesion_id">ID Profesión:</label>
      <input type="number" name="profesion_id" required><br><br>
  
      <input type="submit" value="Registrar" class="boton-ingreso">
    </form>
  
    <br>
    <a href="../Pagina-principal-index.html" class="boton">Volver</a>
  
</body>
</html>
