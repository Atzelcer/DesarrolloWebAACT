<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Búsqueda de libros</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="searchbar">
      <input
        type="text"
        id="searchbar"
        placeholder="Buscar título o autor…"
        autocomplete="off"
      />
      <div class="results"></div>
    </div>

    <div id="bookModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <img id="modalImage" src="" alt="Portada del libro" />
        <h2 id="modalTitle"></h2>
        <p><strong>Autor:</strong> <span id="modalAuthor"></span></p>
        <p><strong>Editorial:</strong> <span id="modalEditorial"></span></p>
        <p><strong>Año:</strong> <span id="modalYear"></span></p>
        <p><strong>Carrera:</strong> <span id="modalCareer"></span></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
