<h2>Tabla de Operación</h2>

<div id="formulario-tabla">
  <label>Tabla del</label>
  <input type="number" id="base" min="1" max="9">
  
  <input type="radio" name="op" value="suma"> Suma
  <input type="radio" name="op" value="resta"> Resta
  <input type="radio" name="op" value="multiplicacion"> Multiplicación
  <input type="radio" name="op" value="division"> División

  <label>Hasta el</label>
  <input type="number" id="limite" min="2">
  
  <button onclick="generarTabla()">Tabla</button>
</div>

<div id="resultado" style="margin-top: 20px;"></div>
